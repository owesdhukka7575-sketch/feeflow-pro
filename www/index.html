<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>FeeFlow Pro</title><style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#152033;--muted:#6b778c;--brand:#2563eb;--brand2:#1d4ed8;--line:#e5eaf1;--good:#16803c;--danger:#c62828;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#dbeafe,transparent 45%),var(--bg)}.login-card{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 20px 60px #10204018}.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--brand),#60a5fa);display:grid;place-items:center;color:#fff;font-weight:800;font-size:21px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.brand{display:flex;gap:13px;align-items:center;margin-bottom:25px}.brand h1{font-size:22px;margin:0}.brand small{color:var(--muted)}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}.input{width:100%;padding:13px 14px;border:1px solid #d7deea;border-radius:11px;outline:0;background:#fff}.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #2563eb15}.btn{padding:11px 15px;border-radius:11px;font-weight:700}.primary{background:var(--brand);color:#fff}.primary:hover{background:var(--brand2)}.ghost{background:#eef3fa;color:var(--ink)}.danger{background:#fee2e2;color:#991b1b}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.top .brand{margin:0}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 68px)}.side{background:#0b1220;color:#dbe4f2;padding:18px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#b9c5d8;text-align:left;padding:12px 13px;border-radius:10px}.nav button.active,.nav button:hover{background:#18243a;color:#fff}.main{padding:24px;max-width:1600px;width:100%;margin:auto}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}.titlebar h2{margin:0;font-size:25px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px #10204007}.metric{font-size:28px;font-weight:800;margin-top:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc;color:#556176}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#edf4ff;color:#1d4ed8;font-size:12px;font-weight:700}.pill.good{background:#eaf8ef;color:#16713b}.pill.warn{background:#fff6dc;color:#8a5a00}.modal{position:fixed;inset:0;background:#09111f99;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{width:min(850px,100%);background:#fff;border-radius:18px;padding:22px;max-height:92vh;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:50}.toast.show{display:block}.empty{padding:40px;text-align:center;color:var(--muted)}.receipt{max-width:820px;margin:auto;border:1px solid #ddd;padding:32px;background:#fff}.receipt-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:16px;gap:20px}.right{text-align:right}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;margin-bottom:15px}.linkbtn{background:none;color:#2563eb;font-weight:700;padding:0}.sum{font-size:20px;font-weight:800}.fee-lines{border:1px solid var(--line);border-radius:12px;overflow:hidden}.fee-line{display:grid;grid-template-columns:1fr 160px 120px;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}.fee-line:last-child{border-bottom:0}.fee-line.head{background:#f8fafc;font-weight:700}.fee-line input{padding:9px;border:1px solid #d7deea;border-radius:9px}.mini{font-size:12px}.statement-total{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.statbox{padding:14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc}.logo-preview{width:70px;height:70px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.logo-preview img{width:100%;height:100%;object-fit:cover}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:sticky;top:68px;z-index:4;overflow:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:span 2}}@media(max-width:560px){.main{padding:14px}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.top{padding:0 12px}.login-card{padding:22px}.filters{grid-template-columns:1fr}.filters button{grid-column:auto}.receipt{padding:18px}.fee-line{grid-template-columns:1fr 110px 90px}.statement-total{grid-template-columns:1fr}}
@media print{body{background:#fff}.top,.side,.titlebar>div:last-child,.btn{display:none!important}.main{padding:0}.receipt{border:0;max-width:none}.modal{display:none}}
</style></head><body><div id="root"></div><div id="toast" class="toast"></div><script src="offline-engine.js"></script>
<script>
const $=s=>document.querySelector(s),root=$('#root');let me=null,inst=null;
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function api(url,opt={}){return await localApi(url,opt)}
async function boot(){try{me=await api('/api/me');await shell()}catch{login()}}
function login(){root.innerHTML=`<div class="login"><div class="login-card"><div class="brand"><div class="logo">FF</div><div><h1>FeeFlow Pro</h1><small>Smart Fee & Institute Management</small></div></div><label>Mobile Number (મોબાઇલ નંબર)</label><input id="phone" class="input" value="9999999999" placeholder="10 digit mobile number"><label>Password (પાસવર્ડ)</label><input id="pass" type="password" class="input" value="Admin@123" placeholder="Password"><div style="height:14px"></div><button class="btn primary" style="width:100%" onclick="passwordLogin()">Login (લોગિન)</button><div style="text-align:center;margin:14px;color:#6b778c">or first-time login</div><button class="btn ghost" style="width:100%" onclick="otpRequest()">Login with OTP (OTPથી લોગિન)</button><p class="muted" style="font-size:12px;margin-top:18px">Demo: 9999999999 / Admin@123</p></div></div>`}
async function passwordLogin(){try{me=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone:$('#phone').value,password:$('#pass').value})});await shell()}catch(e){toast(e.message)}}
async function otpRequest(){try{const phone=$('#phone').value;const d=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({phone})});const code=prompt(d.message);if(code){me=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({phone,code})});await shell()}}catch(e){toast(e.message)}}
async function shell(){const ins=await api('/api/institutes');inst=ins[0]||null;root.innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">FF</div><div><b>FeeFlow Pro</b><div class="muted" style="font-size:11px">${esc(me.user.name)} · ${esc(me.user.role)}</div></div></div><div>${inst?`<span class="pill">${esc(inst.name)}</span>`:''} <button class="btn ghost" onclick="logout()">Logout</button></div></header><div class="layout"><aside class="side"><div class="nav"><button class="active" data-page="dashboard">▣ Dashboard (ડેશબોર્ડ)</button><button data-page="students">♙ Students (વિદ્યાર્થી)</button><button data-page="fees">₹ Fees & Receipts (ફી)</button><button data-page="history">◷ Fee History (ઇતિહાસ)</button><button data-page="feeTypes">⚙ Fee Types (ફી પ્રકાર)</button><button data-page="institutes">⌂ Institutes (સંસ્થા)</button><button data-page="users">♟ Users (યુઝર્સ)</button><button data-page="reports">▤ Reports (રિપોર્ટ)</button><button data-page="activity">◉ Activity Log (લોગ)</button><button data-page="settings">⚙ Settings (સેટિંગ્સ)</button></div></aside><main class="main" id="page"></main></div></div>`;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');page(b.dataset.page)});page(inst?'dashboard':'institutes')}
async function page(p){if(!inst&&p!=='institutes'){p='institutes'} if(p==='dashboard')return dashboard();if(p==='students')return students();if(p==='fees'||p==='history')return fees();if(p==='feeTypes')return feeTypes();if(p==='institutes')return institutes();if(p==='users')return users();if(p==='reports')return reports();if(p==='activity')return activity();if(p==='settings')return settings()}
async function dashboard(){const d=await api('/api/dashboard?instituteId='+inst.id);$('#page').innerHTML=`<div class="titlebar"><div><h2>Dashboard (ડેશબોર્ડ)</h2><div class="muted">${esc(inst.name)}</div></div><div><button class="btn ghost" onclick="feeStatementPrompt()">Student Fee Statement</button> <button class="btn primary" onclick="openFee()">+ Receive Fee (ફી જમા)</button></div></div><div class="cards"><div class="card"><span class="muted">Today's Collection</span><div class="metric">${money(d.today)}</div></div><div class="card"><span class="muted">Total Collection</span><div class="metric">${money(d.total)}</div></div><div class="card"><span class="muted">Pending Fee</span><div class="metric">${money(d.pending)}</div></div><div class="card"><span class="muted">Active Students</span><div class="metric">${d.students}</div></div></div><div class="grid2" style="margin-top:18px"><div class="card"><h3>Simple Daily Workflow</h3><p class="muted">Student setup once → fee heads and amounts saved → daily only choose what amount was received under each fee head → receipt and balances update automatically.</p><button class="btn primary" onclick="students()">Manage Students</button></div><div class="card"><h3>Two Receipt Types</h3><p class="muted"><b>Payment Receipt:</b> what was paid today. <br><b>Total Fee Statement:</b> every fee head, total, paid and remaining balance.</p><button class="btn ghost" onclick="fees()">Open Fee History</button></div></div>`}
async function students(){const rows=await api('/api/students?instituteId='+inst.id);$('#page').innerHTML=`<div class="titlebar"><div><h2>Students (વિદ્યાર્થી)</h2><div class="muted">Student class + complete fee structure</div></div><button class="btn primary" onclick="studentModal()">+ Add Student</button></div><div class="toolbar"><input id="studentSearch" class="input" style="max-width:360px" placeholder="Search student / admission / class" oninput="filterStudentTable()"></div><div class="table-wrap"><table id="studentTable"><thead><tr><th>Admission</th><th>Name</th><th>Class / Section</th><th>Fee Structure</th><th>Total</th><th>Paid</th><th>Balance</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.admission_no||'-')}</td><td><b>${esc(s.name)}</b><br><span class="muted">${esc(s.guardian||'')}</span></td><td>${esc(s.class_name||'-')} ${esc(s.section||'')}</td><td>${s.fee_items.filter(x=>Number(x.assigned_amount)>0).map(x=>`${esc(x.fee_type_name)}: ${money(x.assigned_amount)}`).join('<br>')||'-'}</td><td>${money(s.total_fee)}</td><td>${money(s.paid)}</td><td><b>${money(s.balance)}</b></td><td><button class="linkbtn" onclick="studentHistory('${s.id}')">History</button><br><button class="linkbtn" onclick="editStudent('${s.id}')">Edit</button><br><button class="linkbtn" onclick="showStatement('${s.id}')">Statement</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No students yet.</td></tr>'}</tbody></table></div>`}
function filterStudentTable(){const q=($('#studentSearch').value||'').toLowerCase();document.querySelectorAll('#studentTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')}
async function studentModal(id=''){const types=await api('/api/fee-types?instituteId='+inst.id);let old=null;if(id)old=await api('/api/students/'+id+'/fee-structure');const s=old?.student||{};const map=new Map((old?.items||[]).map(x=>[x.fee_type_id,x.assigned_amount]));modal(`<h3>${id?'Edit Student':'Add Student'} (વિદ્યાર્થી ${id?'બદલો':'ઉમેરો'})</h3><div class="formgrid"><div><label>Admission No. (પ્રવેશ નંબર)</label><input id="adm" class="input" value="${esc(s.admission_no||'')}"></div><div><label>Student Name *</label><input id="sn" class="input" value="${esc(s.name||'')}"></div><div><label>Class / Standard (ધોરણ)</label><input id="cl" class="input" value="${esc(s.class_name||'')}"></div><div><label>Section (વિભાગ)</label><input id="sec" class="input" value="${esc(s.section||'')}"></div><div><label>Guardian / Parent</label><input id="ga" class="input" value="${esc(s.guardian||'')}"></div><div><label>Mobile</label><input id="sp" class="input" value="${esc(s.phone||'')}"></div></div><h4 style="margin:22px 0 8px">Fee Structure (ફીનું માળખું)</h4><p class="muted mini">Set how much this student has to pay for each fee type. You can add more fee types from Fee Types.</p><div class="fee-lines"><div class="fee-line head"><div>Fee Type (ફી પ્રકાર)</div><div>Assigned Fee</div><div>Example</div></div>${types.map(t=>`<div class="fee-line"><div><b>${esc(t.name)}</b></div><input class="feeAmount" data-ft="${t.id}" type="number" min="0" step="0.01" value="${Number(map.get(t.id)||0)}"><div class="mini muted">${money(t.default_amount)}</div></div>`).join('')}</div><div id="studentFeeTotal" style="margin-top:12px;text-align:right;font-weight:800">Total: ${money([...map.values()].reduce((a,x)=>a+Number(x),0))}</div><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveStudent('${id}')">Save Student</button></div>`);document.querySelectorAll('.feeAmount').forEach(x=>x.oninput=()=>{const total=[...document.querySelectorAll('.feeAmount')].reduce((a,e)=>a+Number(e.value||0),0);$('#studentFeeTotal').textContent='Total: '+money(total)})}
async function saveStudent(id){try{const items=[...document.querySelectorAll('.feeAmount')].map(e=>({fee_type_id:e.dataset.ft,amount:Number(e.value||0)}));const body={instituteId:inst.id,admission_no:$('#adm').value,name:$('#sn').value,guardian:$('#ga').value,phone:$('#sp').value,class_name:$('#cl').value,section:$('#sec').value,fee_items:items};await api(id?'/api/students/'+id:'/api/students',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();toast('Student saved');students()}catch(e){toast(e.message)}}
async function editStudent(id){studentModal(id)}
async function feeTypes(){const rows=await api('/api/fee-types?instituteId='+inst.id);$('#page').innerHTML=`<div class="titlebar"><div><h2>Fee Types (ફી પ્રકાર)</h2><div class="muted">Tuition, Travel, Admission, Exam or any custom fee head.</div></div><button class="btn primary" onclick="feeTypeModal()">+ Add Fee Type</button></div><div class="cards">${rows.map(x=>`<div class="card"><h3 style="margin-top:0">${esc(x.name)}</h3><div class="muted">Default amount</div><div class="metric">${money(x.default_amount)}</div><button class="btn ghost" style="margin-top:12px" onclick="feeTypeModal('${x.id}')">Edit</button></div>`).join('')}</div>`}
async function feeTypeModal(id=''){const rows=await api('/api/fee-types?instituteId='+inst.id);const x=id?rows.find(a=>a.id===id):null;modal(`<h3>${id?'Edit':'Add'} Fee Type (ફી પ્રકાર)</h3><label>Name</label><input id="ftn" class="input" value="${esc(x?.name||'')}" placeholder="e.g. Computer Fee"><label>Default Amount</label><input id="fta" type="number" class="input" value="${Number(x?.default_amount||0)}"><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveFeeType('${id}')">Save</button></div>`)}
async function saveFeeType(id){try{const body={instituteId:inst.id,name:$('#ftn').value,default_amount:Number($('#fta').value||0)};await api(id?'/api/fee-types/'+id:'/api/fee-types',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();toast('Fee type saved');feeTypes()}catch(e){toast(e.message)}}
async function fees(){const today=new Date().toISOString().slice(0,10);$('#page').innerHTML=`<div class="titlebar"><div><h2>Fees & Receipts (ફી અને રસીદ)</h2><div class="muted">Find any payment by student, admission number, receipt or date.</div></div><button class="btn primary" onclick="openFee()">+ Receive Fee</button></div><div class="filters"><input id="fq" class="input" placeholder="Student / Admission / Receipt"><input id="ffrom" type="date" class="input"><input id="fto" type="date" class="input"><button class="btn primary" onclick="filterFees()">Search</button></div><div class="toolbar"><button class="btn ghost" onclick="setMonth()">This Month</button><button class="btn ghost" onclick="setToday()">Today</button><button class="btn ghost" onclick="clearFeeFilters()">All Records</button></div><div id="feeBox"></div>`;filterFees()}
async function filterFees(){const q=encodeURIComponent($('#fq')?.value||'');const from=$('#ffrom')?.value||'';const to=$('#fto')?.value||'';const rows=await api('/api/fees?instituteId='+inst.id+'&q='+q+'&from='+from+'&to='+to);renderFeeTable(rows)}
function renderFeeTable(rows){$('#feeBox').innerHTML=`<div class="card" style="margin-bottom:15px"><b>${rows.length}</b> payment record(s) found</div><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Student</th><th>Class</th><th>Fee Allocation</th><th>Received</th><th>Mode</th><th>Actions</th></tr></thead><tbody>${rows.map(f=>`<tr><td><b>#${f.receipt_no}</b></td><td>${new Date(f.received_at).toLocaleString()}</td><td>${esc(f.student_name)}<br><span class="muted">${esc(f.admission_no||'')}</span></td><td>${esc(f.class_name||'-')} ${esc(f.section||'')}</td><td>${f.allocations.map(a=>`${esc(a.fee_type_name)}: ${money(a.amount)}`).join('<br>')}</td><td><b>${money(f.amount)}</b></td><td>${esc(f.payment_mode)}</td><td><button class="linkbtn" onclick="showReceipt('${f.id}')">Payment Receipt</button><br><button class="linkbtn" onclick="showStatement('${f.student_id}')">Total Fee Statement</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No records found.</td></tr>'}</tbody></table></div>`}
function setToday(){const t=new Date().toISOString().slice(0,10);$('#ffrom').value=t;$('#fto').value=t;filterFees()}function setMonth(){const d=new Date();$('#ffrom').value=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);$('#fto').value=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);filterFees()}function clearFeeFilters(){$('#fq').value='';$('#ffrom').value='';$('#fto').value='';filterFees()}
async function openFee(){const rows=await api('/api/students?instituteId='+inst.id);modal(`<h3>Receive Fee (ફી જમા કરો)</h3><label>Student / Standard</label><select id="sid" class="input" onchange="loadAllocationRows()">${rows.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.class_name||'')} ${esc(s.section||'')} — Balance ${money(s.balance)}</option>`).join('')}</select><div id="allocationBox" style="margin-top:16px"></div><label>Payment Mode</label><select id="mode" class="input"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select><label>Remarks</label><input id="rem" class="input"><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveFee()">Save & Generate Payment Receipt</button></div>`);await loadAllocationRows()}
async function loadAllocationRows(){const d=await api('/api/students/'+$('#sid').value+'/fee-structure');$('#allocationBox').innerHTML=`<div class="fee-lines"><div class="fee-line head"><div>Fee Type</div><div>Balance</div><div>Pay Now</div></div>${d.items.map(x=>`<div class="fee-line"><div><b>${esc(x.fee_type_name)}</b></div><div>${money(x.balance)}</div><input class="payAmount" data-ft="${x.fee_type_id}" data-balance="${x.balance}" type="number" min="0" max="${x.balance}" step="0.01" value="0"></div>`).join('')}</div><div id="payTotal" style="margin-top:10px;text-align:right;font-weight:800">Received now: ${money(0)}</div>`;document.querySelectorAll('.payAmount').forEach(e=>e.oninput=()=>{if(Number(e.value)>Number(e.dataset.balance))e.value=e.dataset.balance;const total=[...document.querySelectorAll('.payAmount')].reduce((a,x)=>a+Number(x.value||0),0);$('#payTotal').textContent='Received now: '+money(total)})}
async function saveFee(){try{const allocations=[...document.querySelectorAll('.payAmount')].map(e=>({fee_type_id:e.dataset.ft,amount:Number(e.value||0)})).filter(x=>x.amount>0);const amount=allocations.reduce((a,x)=>a+x.amount,0);if(!amount)return toast('Enter at least one amount');const d=await api('/api/fees',{method:'POST',body:JSON.stringify({studentId:$('#sid').value,amount,allocations,payment_mode:$('#mode').value,remarks:$('#rem').value})});closeModal();toast('Fee received. Receipt #'+d.receipt_no);showReceipt(d.id)}catch(e){toast(e.message)}}
async function showReceipt(id){const f=await api('/api/fees/'+id);$('#page').innerHTML=`<div class="titlebar"><div><h2>Payment Receipt #${f.receipt_no}</h2><div class="muted">Receipt for the amount actually received today.</div></div><div><button class="btn ghost" onclick="fees()">Back</button> <button class="btn primary" onclick="window.print()">Print Receipt</button></div></div><div class="receipt"><div class="receipt-head"><div><h2 style="margin:0">${esc(f.institute_name)}</h2><div>${esc(f.address||'')}</div><div>${esc(f.institute_phone||'')}</div></div><div class="right"><b>FEE PAYMENT RECEIPT</b><div>No. #${f.receipt_no}</div><div>${new Date(f.received_at).toLocaleString()}</div></div></div><div style="padding:22px 0"><p><b>Student:</b> ${esc(f.student_name)}</p><p><b>Admission No:</b> ${esc(f.admission_no||'-')} &nbsp; <b>Class:</b> ${esc(f.class_name||'-')} ${esc(f.section||'')}</p><p><b>Guardian:</b> ${esc(f.guardian||'-')}</p><p><b>Payment Mode:</b> ${esc(f.payment_mode)}</p><h4>Amount received against (આજે કઈ ફી ભરાઈ)</h4><div class="table-wrap"><table style="min-width:0"><thead><tr><th>Fee Type</th><th>Paid Now</th></tr></thead><tbody>${f.allocations.map(a=>`<tr><td>${esc(a.fee_type_name)}</td><td><b>${money(a.amount)}</b></td></tr>`).join('')}</tbody><tfoot><tr><th>Total Received</th><th>${money(f.amount)}</th></tr></tfoot></table></div><p><b>Remarks:</b> ${esc(f.remarks||'-')}</p></div><div style="border-top:1px solid #ddd;padding-top:20px;text-align:right">Authorized Signature</div></div>`}
async function showStatement(id){const d=await api('/api/student-statement/'+id);renderStatement(d)}
function renderStatement(d){$('#page').innerHTML=`<div class="titlebar"><div><h2>Total Fee Statement (કુલ ફી સ્ટેટમેન્ટ)</h2><div class="muted">Complete fee structure, paid amount and remaining balance.</div></div><div><button class="btn ghost" onclick="students()">Back</button> <button class="btn primary" onclick="window.print()">Print Statement</button></div></div><div class="receipt"><div class="receipt-head"><div><h2 style="margin:0">${esc(d.student.institute_name)}</h2><div>${esc(d.student.admission_no||'')} · ${esc(d.student.class_name||'')} ${esc(d.student.section||'')}</div></div><div class="right"><b>TOTAL FEE STATEMENT</b><div>${new Date().toLocaleDateString()}</div></div></div><div style="padding:18px 0"><p><b>Student:</b> ${esc(d.student.name)} &nbsp; <b>Guardian:</b> ${esc(d.student.guardian||'-')}</p><div class="table-wrap"><table style="min-width:0"><thead><tr><th>Fee Type (ફી પ્રકાર)</th><th>Total Fee</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${esc(x.fee_type_name)}</td><td>${money(x.assigned_amount)}</td><td>${money(x.paid)}</td><td><b>${money(x.balance)}</b></td></tr>`).join('')}</tbody><tfoot><tr><th>Grand Total</th><th>${money(d.total_fee)}</th><th>${money(d.paid)}</th><th>${money(d.balance)}</th></tr></tfoot></table></div><div class="statement-total"><div class="statbox"><div class="muted">Total Fees</div><b>${money(d.total_fee)}</b></div><div class="statbox"><div class="muted">Total Paid</div><b>${money(d.paid)}</b></div><div class="statbox"><div class="muted">Total Pending</div><b>${money(d.balance)}</b></div></div></div><div style="border-top:1px solid #ddd;padding-top:20px;text-align:right">Authorized Signature</div></div>`}
async function feeStatementPrompt(){const rows=await api('/api/students?instituteId='+inst.id);modal(`<h3>Total Fee Statement (કુલ ફી સ્ટેટમેન્ટ)</h3><label>Select Student</label><select id="stmtSid" class="input">${rows.map(s=>`<option value="${s.id}">${esc(s.name)} — ${esc(s.class_name||'')}</option>`).join('')}</select><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="const id=$('#stmtSid').value;closeModal();showStatement(id)">View Statement</button></div>`)}
async function studentHistory(id){const d=await api('/api/student-history/'+id);modal(`<h3>${esc(d.student.name)} — Fee History (ફી ઇતિહાસ)</h3><div class="statement-total"><div class="statbox">Total Fee<br><b>${money(d.total_fee)}</b></div><div class="statbox">Paid<br><b>${money(d.paid)}</b></div><div class="statbox">Balance<br><b>${money(d.balance)}</b></div></div><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Fee Allocation</th><th>Amount</th><th>Mode</th></tr></thead><tbody>${d.fees.map(f=>`<tr><td>#${f.receipt_no}</td><td>${new Date(f.received_at).toLocaleString()}</td><td>${f.allocations.map(a=>`${esc(a.fee_type_name)}: ${money(a.amount)}`).join('<br>')}</td><td>${money(f.amount)}</td><td>${esc(f.payment_mode)}</td></tr>`).join('')||'<tr><td colspan="5">No payments.</td></tr>'}</tbody></table></div><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Close</button> <button class="btn primary" onclick="closeModal();showStatement('${id}')">Total Fee Statement</button></div>`)}
async function institutes(){const rows=await api('/api/institutes');$('#page').innerHTML=`<div class="titlebar"><div><h2>Institutes (સંસ્થા)</h2><div class="muted">Maximum allowed by your current plan.</div></div><button class="btn primary" onclick="instModal()">+ Add Institute</button></div><div class="cards">${rows.map(i=>`<div class="card"><div class="brand"><div class="logo">${i.logo_url?`<img src="${esc(i.logo_url)}">`:(esc((i.name||'I')[0]))}</div><div><h3 style="margin:0">${esc(i.name)}</h3><small class="muted">${esc(i.phone||'')}</small></div></div><p class="muted">${esc(i.address||'No address set')}</p><button class="btn ${inst?.id===i.id?'primary':'ghost'}" onclick="selectInst('${i.id}')">${inst?.id===i.id?'Selected':'Open Institute'}</button> <button class="btn ghost" onclick="editInst('${i.id}')">Edit</button></div>`).join('')||'<div class="card empty">No institute</div>'}</div>`}
function selectInst(id){api('/api/institutes').then(x=>{inst=x.find(i=>i.id===id);toast('Institute selected');page('dashboard')})}
async function editInst(id){const rows=await api('/api/institutes');const i=rows.find(x=>x.id===id);instModal(i)}
function instModal(i=null){modal(`<h3>${i?'Edit':'Add'} Institute (સંસ્થા)</h3><label>Institute Name *</label><input id="in" class="input" value="${esc(i?.name||'')}"><label>Logo URL (optional)</label><input id="il" class="input" value="${esc(i?.logo_url||'')}" placeholder="https://..."><label>Address</label><input id="ia" class="input" value="${esc(i?.address||'')}"><label>Phone</label><input id="ip" class="input" value="${esc(i?.phone||'')}"><label>Email</label><input id="ie" class="input" value="${esc(i?.email||'')}"><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveInst('${i?.id||''}')">Save</button></div>`)}
async function saveInst(id){try{const body={name:$('#in').value,logo_url:$('#il').value,address:$('#ia').value,phone:$('#ip').value,email:$('#ie').value};await api(id?'/api/institutes/'+id:'/api/institutes',{method:id?'PUT':'POST',body:JSON.stringify(body)});closeModal();const x=await api('/api/institutes');inst=x.find(a=>a.id===id)||x[0];toast('Institute saved');institutes()}catch(e){toast(e.message)}}
async function users(){const rows=await api('/api/owner-users');$('#page').innerHTML=`<div class="titlebar"><div><h2>Users & Permissions</h2><div class="muted">Owner can create staff accounts.</div></div><button class="btn primary" onclick="userModal()">+ Add User</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Status</th><th>Created</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td><span class="pill">${esc(u.role)}</span></td><td>${u.active?'Active':'Disabled'}</td><td>${new Date(u.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`}
function userModal(){modal(`<h3>Add Staff User</h3><label>Name</label><input id="un" class="input"><label>Mobile</label><input id="up" class="input"><label>Password</label><input id="ux" type="password" class="input"><label>Role</label><select id="ur" class="input"><option>STAFF</option><option>ACCOUNTANT</option><option>VIEWER</option></select><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveUser()">Create User</button></div>`)}
async function saveUser(){try{await api('/api/owner-users',{method:'POST',body:JSON.stringify({name:$('#un').value,phone:$('#up').value,password:$('#ux').value,role:$('#ur').value})});closeModal();toast('User created');users()}catch(e){toast(e.message)}}
async function reports(){const today=new Date().toISOString().slice(0,10);$('#page').innerHTML=`<div class="titlebar"><div><h2>Reports (રિપોર્ટ)</h2><div class="muted">Choose any period and see total collection + fee-type collection.</div></div></div><div class="filters"><input id="rfrom" type="date" class="input" value="${today}"><input id="rto" type="date" class="input" value="${today}"><div></div><button class="btn primary" onclick="loadReport()">View Report</button></div><div id="reportBox"></div>`;loadReport()}
async function loadReport(){const from=$('#rfrom').value,to=$('#rto').value;const d=await api('/api/reports/collection?instituteId='+inst.id+'&from='+from+'&to='+to);$('#reportBox').innerHTML=`<div class="cards" style="margin-bottom:18px"><div class="card"><span class="muted">Entries</span><div class="metric">${d.totals.entries}</div></div><div class="card"><span class="muted">Collection</span><div class="metric">${money(d.totals.total)}</div></div></div><div class="grid2"><div class="table-wrap"><table style="min-width:0"><thead><tr><th>Fee Type</th><th>Collected</th></tr></thead><tbody>${d.byType.map(r=>`<tr><td>${esc(r.fee_type_name)}</td><td><b>${money(r.total)}</b></td></tr>`).join('')||'<tr><td colspan="2">No data.</td></tr>'}</tbody></table></div><div class="table-wrap"><table style="min-width:0"><thead><tr><th>Date</th><th>Entries</th><th>Total</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r.day}</td><td>${r.entries}</td><td><b>${money(r.total)}</b></td></tr>`).join('')||'<tr><td colspan="3">No collection.</td></tr>'}</tbody></table></div></div>`}
async function activity(){const rows=await api('/api/activity');$('#page').innerHTML=`<div class="titlebar"><div><h2>Activity Log (લોગ)</h2><div class="muted">Who did what and when.</div></div></div><div class="table-wrap"><table><thead><tr><th>Date & Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${new Date(a.created_at).toLocaleString()}</td><td>${esc(a.user_name||'-')}<br>${esc(a.phone||'')}</td><td><span class="pill">${esc(a.action)}</span></td><td>${esc(a.meta||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No activity yet.</td></tr>'}</tbody></table></div>`}
async function settings(){const d=await api('/api/me');$('#page').innerHTML=`<div class="titlebar"><div><h2>Settings (સેટિંગ્સ)</h2></div></div><div class="grid2"><div class="card"><h3>Account</h3><p><b>${esc(d.user.name)}</b><br>${esc(d.user.phone)}<br>Role: ${esc(d.user.role)}</p><button class="btn primary" onclick="passwordModal()">Change Password</button></div><div class="card"><h3>Subscription</h3><p><b>${esc(d.subscription?.plan_name||'Trial')}</b><br>Price: ${money(d.subscription?.price||0)}<br>Institute limit: ${d.subscription?.max_institutes||1}</p></div><div class="card"><h3>Institute Branding</h3><p class="muted">Institute name, logo, address and receipt header can be configured per institute. White-label branding can later be enabled as a paid add-on.</p><button class="btn ghost" onclick="institutes()">Institute Setup</button></div></div>`}
function passwordModal(){modal(`<h3>Change Password</h3><label>New Password</label><input id="np" type="password" class="input"><div style="margin-top:18px;text-align:right"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="changePass()">Save</button></div>`)}
async function changePass(){try{await api('/api/auth/password',{method:'POST',body:JSON.stringify({password:$('#np').value})});closeModal();toast('Password changed')}catch(e){toast(e.message)}}
function modal(html){const d=document.createElement('div');d.className='modal';d.id='modal';d.innerHTML='<div class="modal-card">'+html+'</div>';document.body.appendChild(d)}function closeModal(){document.getElementById('modal')?.remove()}async function logout(){await api('/api/auth/logout',{method:'POST'});location.reload()}
boot();
</script><div style="position:fixed;right:8px;bottom:8px;z-index:9999;display:flex;gap:6px;font:12px sans-serif" class="no-print"><button onclick="ffExport()" style="padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff">⬇ Backup</button><button onclick="document.getElementById('ffr').click()" style="padding:6px 10px;border-radius:8px;border:1px solid #ccc;background:#fff">⬆ Restore</button><input id="ffr" type="file" accept=".json" hidden onchange="ffImport(this.files[0]).catch(e=>alert(e.message))"></div></body></html>
